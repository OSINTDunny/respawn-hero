<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>recovery kill chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #2b2926;
    --muted: #50565d;
    --stone: #a4a8af;
    --accent: #0000ee;
    --fault: #ff2c2c;
    --dashed: rgba(43, 41, 38, 0.32);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    width: 100%;
    max-width: 540px;
    height: 553px;
    padding: 22px 24px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 0;
    overflow: hidden;
  }

  /* ---- eyebrow header (matches the hero ledger style) ---- */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .eyebrow::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* ---- chain links ---- */
  .chain {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    flex: 1;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    border: 1px dashed var(--dashed);
    border-radius: 2px;
    background: var(--bg);
    font-size: 11px;
    line-height: 1.3;
  }

  .chip {
    background: var(--accent);
    color: #ffffff;
    padding: 3px 8px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 2px;
    flex-shrink: 0;
    font-size: 10.5px;
  }

  .verb {
    flex: 1;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .age {
    color: var(--text);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    font-size: 10.5px;
    flex-shrink: 0;
  }

  .arrow {
    text-align: center;
    font-size: 11px;
    line-height: 1;
    color: var(--accent);
    padding: 5px 0;
    user-select: none;
  }

  /* ---- footer reveal ---- */
  .footer {
    border-top: 1px dashed var(--dashed);
    padding-top: 14px;
    margin-top: 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 11px;
    line-height: 1.55;
  }

  .warn {
    color: var(--fault);
    font-size: 14px;
    line-height: 1.2;
    flex-shrink: 0;
    font-weight: 700;
  }

  .footer-body { color: var(--text); }
  .footer-body strong { font-weight: 600; }
  .footer-body .muted { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">respawn · kill chain detected</div>

    <div class="chain">
      <div class="link">
        <span class="chip">[secret]</span>
        <span class="verb">expires</span>
        <span class="age">· 90d</span>
      </div>
      <div class="arrow">▾</div>

      <div class="link">
        <span class="chip">[permission]</span>
        <span class="verb">drifts</span>
        <span class="age">· 47d</span>
      </div>
      <div class="arrow">▾</div>

      <div class="link">
        <span class="chip">[route]</span>
        <span class="verb">changes</span>
        <span class="age">· 23d</span>
      </div>
      <div class="arrow">▾</div>

      <div class="link">
        <span class="chip">[dependency]</span>
        <span class="verb">moves</span>
        <span class="age">· 12d</span>
      </div>
      <div class="arrow">▾</div>

      <div class="link">
        <span class="chip">[runbook]</span>
        <span class="verb">goes stale</span>
        <span class="age">· 8mo</span>
      </div>
    </div>

    <div class="footer">
      <span class="warn">⚠</span>
      <div class="footer-body">
        <strong>next failover would fail.</strong><br />
        <span class="muted">respawn finds the chain, tests the path, drives the fix.</span>
      </div>
    </div>
  </div>
</body>
</html>
